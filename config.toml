[models]
sb_light_model = "paraphrase-multilingual-MiniLM-L12-v2"
sb_medium_model = "intfloat/multilingual-e5-small"
sb_activo = "paraphrase-multilingual-MiniLM-L12-v2"

[paths]
data_dir = "data"
corpus_dir = "src/corp_extractor/datos"
chroma_dir = "data/chroma"

[chroma]
coleccion = "corpus_canonico"
espacio_hnsw = "cosine"
telemetria = false
batch_size = 200

[corp_extractor]
# Ruta donde se guardan y leen los JSONs del vaticano
directorio_datos = "src/corp_extractor/datos/"
# Modo de ejecucion de los extractores: # Usar "dinamico" para forzar la descarga web desde vatican.va, o "estatico" desde local si existen documentos
modo_ejecucion = "estatico"