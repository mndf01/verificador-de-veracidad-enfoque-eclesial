[project]
name = "verificador-veracidad"
version = "0.1.0"
description = "Verificador de veracidad con base cerrada de documentos de la Iglesia Católica: contrasta noticias/artículos frente a textos normativos canónicos usando RAG (ChromaDB) + heurísticas semánticas IVR + Random Forest."
requires-python = ">=3.12"
dependencies = [
    # Configuración centralizada (config.toml leído con pydantic)
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Capa RAG: base vectorial y embeddings
    "chromadb>=1.5",
    "sentence-transformers>=3.0",   # arrastra torch (ver README: instalar torch CPU primero)

    # ETL de corpus (scrapers + clasificador)
    "beautifulsoup4>=4.12",
    "requests>=2.31",

    # Extracción de contenido web (noticias)
    "trafilatura>=1.8",

    # Expansión dinámica: lectura de PDF con texto nativo (sin OCR)
    "pypdf>=5.0",
    "pdfplumber>=0.11",   # posición de las palabras: detecta PDFs de dos columnas

    # IVR / modelo (Random Forest) — usadas por el módulo de decisión
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "joblib>=1.4",   # guardar/cargar el modelo RF entrenado (src/modelo/rf.py)
]

[project.optional-dependencies]
# pip install -e ".[dev]"  → para correr las pruebas (tests/)
dev = [
    "pytest>=8",
    "reportlab>=4",   # genera los PDF de prueba
]

[project.scripts]
# Comando de terminal que une todo el pipeline (web_extractor → IVR → RF).
# Tras `pip install -e .` queda disponible como `verificador ...`.
verificador = "src.cli:main"

[tool.setuptools]
# El proyecto se ejecuta desde la raíz con imports prefijados `src.` (módulos
# `python -m src.*`). Además de `config` como módulo top-level, se registran los
# paquetes `src` para que el entry point `verificador` funcione tras
# `pip install -e .`.
packages = ["src", "src.base_datos", "src.corp_extractor", "src.expansion_dinamica", "src.modelo", "src.procesamiento_nlp", "src.vectorizacion", "src.web_extractor", "src.cli"]
py-modules = ['config']
